name: Tool - clearer text on treatment records

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every line, then change TreatmentRecords.kt
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          KT = pathlib.Path('app/src/main/java/com/mahalakshmi/dental')
          GRADLE = pathlib.Path('app/build.gradle.kts')

          # Each change in TreatmentRecords.kt: the lines that must be there now, the lines that replace them
          CHANGES = [
              (['Text("OPD ${r.opd}", fontSize = 12.sp, color = Brand.Slate)', 'Spacer(Modifier.height(4.dp))'],
               ['        Text(',
                '            "OPD ${r.opd}", fontSize = 13.sp, fontWeight = FontWeight.Medium, color = Brand.Ink,',
                '            modifier = Modifier.padding(top = 4.dp).clip(RoundedCornerShape(8.dp)).background(Brand.Soft)',
                '                .padding(horizontal = 8.dp, vertical = 3.dp)',
                '        )',
                '        Spacer(Modifier.height(8.dp))']),
              (['txSummary(r.treatments), fontSize = 13.sp, color = Brand.Sub, maxLines = 2,'],
               ['                txSummary(r.treatments), fontSize = 15.sp, fontWeight = FontWeight.Medium, color = Brand.Ink, maxLines = 2,']),
              (['Text(rs(r.total), fontSize = 14.sp, fontWeight = FontWeight.SemiBold, color = Brand.Ink)'],
               ['                Text(rs(r.total), fontSize = 16.sp, fontWeight = FontWeight.SemiBold, color = Brand.Ink)']),
              (['fontSize = 12.sp, color = Brand.GoldDeep, maxLines = 1, overflow = TextOverflow.Ellipsis,'],
               ['                    fontSize = 13.sp, fontWeight = FontWeight.Medium, color = Brand.GoldDeep, maxLines = 1, overflow = TextOverflow.Ellipsis,']),
              (['Text("${rs(r.left)} due", fontSize = 12.sp, fontWeight = FontWeight.Medium, color = Brand.Red)'],
               ['                    Text("${rs(r.left)} due", fontSize = 13.sp, fontWeight = FontWeight.SemiBold, color = Brand.Red)']),
              (['if (sub.isNotBlank()) Text(sub, fontSize = 12.sp, color = Brand.Sub, maxLines = 1, overflow = TextOverflow.Ellipsis)'],
               ['            if (sub.isNotBlank()) Text(sub, fontSize = 13.sp, color = Brand.Slate, maxLines = 1, overflow = TextOverflow.Ellipsis)']),
              (['AppCard(Modifier.fillMaxWidth(), padding = 18.dp) {',
                'Row(verticalAlignment = Alignment.CenterVertically) {',
                'SectionHeader("Teeth & treatments", Modifier.weight(1f))'],
               ['                        Text(',
                '                            "OPD No. ${record.opd}", fontSize = 14.sp, fontWeight = FontWeight.SemiBold, color = Brand.Ink,',
                '                            modifier = Modifier.clip(RoundedCornerShape(10.dp)).background(Brand.Surface)',
                '                                .padding(horizontal = 12.dp, vertical = 6.dp)',
                '                        )',
                '                        AppCard(Modifier.fillMaxWidth(), padding = 18.dp) {',
                '                            Row(verticalAlignment = Alignment.CenterVertically) {',
                '                                SectionHeader("Teeth & treatments", Modifier.weight(1f))']),
          ]

          problems = []
          path = KT / 'TreatmentRecords.kt'
          lines = path.read_text(encoding='utf-8').split('\n') if path.is_file() else None
          found = []
          if lines is None:
              problems.append('TreatmentRecords.kt was not found')
          else:
              for old, new in CHANGES:
                  hits = [i for i in range(len(lines) - len(old) + 1)
                          if all(lines[i + k].strip() == old[k] for k in range(len(old)))]
                  if len(hits) != 1:
                      problems.append('TreatmentRecords.kt: expected once, found %d times: %s' % (len(hits), ' | '.join(old)))
                  else:
                      found.append((hits[0], len(old), new))

          gradle = GRADLE.read_text(encoding='utf-8').split('\n') if GRADLE.is_file() else []
          code = [i for i, l in enumerate(gradle) if re.fullmatch(r'\s*versionCode\s*=\s*\d+\s*', l)]
          vname = [i for i, l in enumerate(gradle) if re.fullmatch(r'\s*versionName\s*=\s*"\d+\.0"\s*', l)]
          if len(code) != 1 or len(vname) != 1:
              problems.append('app/build.gradle.kts: versionCode / versionName lines not found exactly once')

          if problems:
              print('NOTHING WAS CHANGED')
              for p in problems:
                  print(' - ' + p)
              sys.exit(1)

          for start, count, new in sorted(found, key=lambda f: -f[0]):
              lines[start:start + count] = new
          path.write_text('\n'.join(lines), encoding='utf-8')
          version = int(re.search(r'\d+', gradle[code[0]]).group(0)) + 1
          gradle[code[0]] = re.sub(r'\d+', str(version), gradle[code[0]], count=1)
          gradle[vname[0]] = re.sub(r'"\d+\.0"', '"%d.0"' % version, gradle[vname[0]], count=1)
          GRADLE.write_text('\n'.join(gradle), encoding='utf-8')
          print('Treatment records are easier to read. New version: %d' % version)
          PY

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Treatment records: larger, darker OPD number and treatments"
          git push
