name: Dark mode and swipe (one time)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the screens
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          SRC = pathlib.Path("app/src/main/java/com/mahalakshmi/dental")
          problems = []

          def need(name, marker):
              p = SRC / name
              if not p.exists() or marker not in p.read_text(encoding="utf-8"):
                  problems.append("Paste the new %s first, then run this again." % name)

          need("Theme.kt", "object AppTheme")
          need("SwipeTabs.kt", "fun TabPager")
          if problems:
              print("\n".join(problems))
              sys.exit(1)

          def once(text, old, new, where):
              n = text.count(old)
              if n != 1:
                  problems.append("%s: found %d matches for: %s" % (where, n, old))
                  return text
              return text.replace(old, new)

          def line(text, marker, where, replace=None, after=None):
              lines = text.split("\n")
              hits = [i for i, l in enumerate(lines) if marker in l]
              if len(hits) != 1:
                  problems.append("%s: found %d lines with: %s" % (where, len(hits), marker))
                  return text
              i = hits[0]
              indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
              if replace is not None:
                  lines[i] = indent + replace
              if after is not None:
                  lines.insert(i + 1, indent + after)
              return "\n".join(lines)

          def edit(name, fn):
              p = SRC / name
              p.write_text(fn(p.read_text(encoding="utf-8")), encoding="utf-8")
              print("Updated", name)

          # 1) Cards, dialogs and buttons follow light / dark mode
          pill = re.compile(r"(Pill\([^\n]*?), Color\.White,")
          for path in sorted(SRC.glob("*.kt")):
              if path.name in ("Theme.kt", "SwipeTabs.kt", "SplashScreen.kt"):
                  continue
              t = path.read_text(encoding="utf-8")
              u = t.replace(".background(Color.White)", ".background(Brand.Surface)")
              u = u.replace("bg = Color.White", "bg = Brand.Surface")
              u = u.replace("SolidColor(Color.White)", "SolidColor(Brand.Surface)")
              u = u.replace("statusSoft(status) else Color.White", "statusSoft(status) else Brand.Surface")
              u = pill.sub(r"\1, Brand.Surface,", u)
              u = u.replace("private val PurpleSoft = Color(0xFFF1EBFF)",
                            "private val PurpleSoft get() = if (AppTheme.dark) Color(0xFF2B2442) else Color(0xFFF1EBFF)")
              u = u.replace("private val BlueSoft = Color(0xFFE8F0FF)",
                            "private val BlueSoft get() = if (AppTheme.dark) Color(0xFF1B2A45) else Color(0xFFE8F0FF)")
              if u != t:
                  path.write_text(u, encoding="utf-8")
                  print("Dark-mode colours:", path.name)

          # 2) The splash screen stays white with dark text
          edit("SplashScreen.kt", lambda t: once(
              t, "color = Brand.Charcoal, letterSpacing = spacing.value.sp",
              "color = Color(0xFF2A302E), letterSpacing = spacing.value.sp", "SplashScreen.kt"))

          # 3) Home: dark-mode colours, and the light / dark button instead of the initials
          def home(t):
              for key, dark in [("TealText", "0xFF9CCB5A"), ("TealSoft", "0xFF223019"), ("Amber", "0xFFF0B640"),
                                ("AmberSoft", "0xFF332914"), ("Page", "0xFF0F1412"), ("DueRed", "0xFFFF6B70")]:
                  m = re.search(r"val %s = Color\((0x[0-9A-Fa-f]{8})\)" % key, t)
                  if not m:
                      problems.append("TodayScreen.kt: colour %s not found" % key)
                      continue
                  t = t.replace(m.group(0), "val %s get() = if (AppTheme.dark) Color(%s) else Color(%s)" % (key, dark, m.group(1)))
              t = line(t, "54.dp, ring = true)", "TodayScreen.kt", replace="ThemeToggle()")
              t = line(t, "clickable { go(Screen.ClinicSettings) }) {", "TodayScreen.kt", replace="Box {")
              return t
          edit("TodayScreen.kt", home)

          # 4) Menu: Light / Dark / Auto choice, and the bottom bar colour
          def menu(t):
              t = once(t, ".clip(shape).background(Brand.Charcoal)", ".clip(shape).background(Brand.Night)", "Menu.kt")
              return line(t, 'MenuHeading("Settings")', "Menu.kt", after="AppearanceRow()")
          edit("Menu.kt", menu)

          # 5) Swipe between Home, Patients, Schedule and Finance; remember the light / dark choice
          def main(t):
              w = "MainActivity.kt"
              t = line(t, "db = ClinicDb(applicationContext)", w, after="AppTheme.load(applicationContext)")
              t = once(t, "StatusBarIcons(dark = true)", "StatusBarIcons(dark = !AppTheme.dark)", w)
              t = once(t, "drawerContainerColor = Color.White", "drawerContainerColor = Brand.Surface", w)
              t = once(t, "is Screen.Home -> TodayScreen(db, go)", "is Screen.Home -> TabPager(screen, db, go, open)", w)
              t = once(t, "is Screen.Schedule -> ScheduleScreen(db, go)", "is Screen.Schedule -> TabPager(screen, db, go, open)", w)
              t = once(t, "is Screen.Finance -> FinanceScreen(db, go)", "is Screen.Finance -> TabPager(screen, db, go, open)", w)
              t = once(t, "is Screen.Patients -> PatientsScreen(db, screen.filter, screen.focusSearch, go)",
                       "is Screen.Patients -> TabPager(screen, db, go, open)", w)
              return line(t, 'label = "navigation"', w,
                          replace='contentKey = { e -> if (tabIndexOf(e.screen) >= 0) "tabs" else e },',
                          after='label = "navigation"')
          edit("MainActivity.kt", main)

          if problems:
              print("\n".join(problems))
              sys.exit(1)

          gradle = pathlib.Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          code = int(re.search(r"versionCode\s*=\s*(\d+)", g).group(1)) + 1
          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = %d" % code, g, count=1)
          g = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "%d.0"' % code, g, count=1)
          gradle.write_text(g, encoding="utf-8")
          print("All done. Version is now %d.0" % code)
          PY

      - name: Save the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Dark mode and swipe between tabs"
          git push

      - name: Start the APK build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"
