name: Match colours (one time)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Change teal to the clinic green
        run: |
          python3 - <<'PY'
          import colorsys
          import pathlib
          import re
          import sys

          SRC = pathlib.Path("app/src/main/java/com/mahalakshmi/dental")
          GREEN = 85 / 360.0

          def to_green(hex6):
              r, g, b = (int(hex6[i:i + 2], 16) / 255.0 for i in (0, 2, 4))
              h, l, s = colorsys.rgb_to_hls(r, g, b)
              chroma = max(r, g, b) - min(r, g, b)
              if not (160 / 360.0 <= h <= 200 / 360.0) or l < 0.12:
                  return None
              if l > 0.8:
                  if chroma < 0.025:
                      return None
                  s2 = min(0.6, s * 1.5)
                  l2 = l
              else:
                  if s < 0.25 or chroma < 0.06:
                      return None
                  s2 = min(1.0, s * 1.15)
                  l2 = l + 0.09 * max(0.0, 0.5 - l) / 0.284
              r2, g2, b2 = colorsys.hls_to_rgb(GREEN, l2, s2)
              return "%02X%02X%02X" % (round(r2 * 255), round(g2 * 255), round(b2 * 255))

          colour = re.compile(r"(?<![0-9A-Za-z_])(0[xX])([0-9A-Fa-f]{2})([0-9A-Fa-f]{6})(?![0-9A-Fa-f])")
          files = 0
          for path in sorted(SRC.glob("*.kt")):
              text = path.read_text(encoding="utf-8")
              notes = []

              def swap(m):
                  new = to_green(m.group(3))
                  if new is None:
                      return m.group(0)
                  notes.append(m.group(2) + m.group(3) + " -> " + m.group(2) + new)
                  return m.group(1) + m.group(2) + new

              updated = colour.sub(swap, text)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  files += 1
                  print(path.name)
                  for n in notes:
                      print("   " + n)

          if files == 0:
              print("No teal colours found. Nothing was changed.")
              sys.exit(1)

          gradle = pathlib.Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          code = int(re.search(r"versionCode\s*=\s*(\d+)", g).group(1)) + 1
          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = %d" % code, g, count=1)
          g = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "%d.0"' % code, g, count=1)
          gradle.write_text(g, encoding="utf-8")
          print("Files changed: %d. Version is now %d.0" % (files, code))
          PY

      - name: Save the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use the clinic green on every screen"
          git push

      - name: Start the APK build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"
