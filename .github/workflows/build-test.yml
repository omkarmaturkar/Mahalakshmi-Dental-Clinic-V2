name: tool-round1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every line, then change
        run: |
          python3 - <<'PY_END'
          import glob, os, re, sys

          def stop(msg):
              print(msg)
              print("NOTHING WAS CHANGED")
              sys.exit(1)

          def find(name):
              hits = glob.glob("app/src/main/**/" + name, recursive=True)
              if len(hits) != 1:
                  stop("Could not find exactly one " + name + " (found %d)" % len(hits))
              return hits[0]

          files = {
              "theme": find("Theme.kt"),
              "backup": find("Backup.kt"),
              "screen": find("BackupScreen.kt"),
              "drive": find("DriveBackup.kt"),
              "gradle": "app/build.gradle.kts",
              "manifest": "app/src/main/AndroidManifest.xml",
          }
          text = {}
          for key, path in files.items():
              if not os.path.exists(path):
                  stop("Missing file: " + path)
              text[key] = open(path, encoding="utf-8").read().split("\n")

          problems = []

          def where(key, old):
              return [i for i, l in enumerate(text[key]) if l.strip() == old]

          def check(key, old, count=1):
              n = len(where(key, old))
              if n == count:
                  print("OK       " + files[key] + ":  " + old)
              else:
                  print("MISSING  " + files[key] + ":  " + old + "  (found %d, expected %d)" % (n, count))
                  problems.append(old)

          def check_near(key, old, offset, expected):
              hits = where(key, old)
              lines = text[key]
              if len(hits) == 1 and 0 <= hits[0] + offset < len(lines) and lines[hits[0] + offset].strip() == expected:
                  print("OK       " + files[key] + ":  " + expected)
              else:
                  print("MISSING  " + files[key] + ":  " + expected + "  (next to: " + old + ")")
                  problems.append(expected)

          SUB_OLD = "val Sub: Color get() = if (d) Color(0xFFA6AFAA) else Color(0xFF69716D)"
          FAINT_OLD = "val Faint: Color get() = if (d) Color(0xFF6E7873) else Color(0xFFA3AAA6)"
          POPPINS = [
              "val Poppins = FontFamily(",
              "Font(R.font.poppins_regular, FontWeight.Normal),",
              "Font(R.font.poppins_medium, FontWeight.Medium),",
              "Font(R.font.poppins_semibold, FontWeight.SemiBold),",
              "Font(R.font.poppins_bold, FontWeight.Bold)",
              ")",
          ]
          EXT_OLD = "private fun TextStyle.poppins(): TextStyle = copy(fontFamily = Poppins)"
          SERIF = ["displayLarge", "displayMedium", "displaySmall", "headlineLarge", "headlineMedium", "headlineSmall", "titleLarge"]
          THEME_OLD = "MaterialTheme(colorScheme = scheme, typography = AppTypography) { ScaledForTablets(content) }"
          ICONS_NOTE = "/** dark = true gives dark icons (for light pages); false gives light icons (for dark pages). */"
          TITLES = [
              ("Text(title, fontWeight = FontWeight.SemiBold, fontSize = 21.sp, color = Brand.Ink, maxLines = 1, overflow = TextOverflow.Ellipsis)",
               "Text(title, fontFamily = ClinicTitleFont, fontWeight = FontWeight.SemiBold, fontSize = 20.sp, color = Brand.Ink, maxLines = 1, overflow = TextOverflow.Ellipsis)"),
              ("Text(title, fontWeight = FontWeight.SemiBold, fontSize = 17.sp, color = Brand.GreenText)",
               "Text(title, fontFamily = ClinicTitleFont, fontWeight = FontWeight.SemiBold, fontSize = 17.sp, color = Brand.GreenText)"),
              ("Text(title, fontWeight = FontWeight.SemiBold, fontSize = 18.sp, color = Brand.GreenText)",
               "Text(title, fontFamily = ClinicTitleFont, fontWeight = FontWeight.SemiBold, fontSize = 18.sp, color = Brand.GreenText)"),
              ("Text(title, fontWeight = FontWeight.SemiBold, fontSize = 20.sp, color = Brand.Ink)",
               "Text(title, fontFamily = ClinicTitleFont, fontWeight = FontWeight.SemiBold, fontSize = 20.sp, color = Brand.Ink)"),
              ("Text(title, fontWeight = FontWeight.SemiBold, fontSize = 17.sp, color = Brand.Ink, textAlign = TextAlign.Center)",
               "Text(title, fontFamily = ClinicTitleFont, fontWeight = FontWeight.SemiBold, fontSize = 17.sp, color = Brand.Ink, textAlign = TextAlign.Center)"),
              ('Text("Mahalaxmi", fontWeight = FontWeight.Bold, fontSize = 19.sp, color = Brand.Charcoal, lineHeight = 22.sp)',
               'Text("Mahalaxmi", fontFamily = ClinicTitleFont, fontWeight = FontWeight.Bold, fontSize = 19.sp, color = Brand.Charcoal, lineHeight = 22.sp)'),
          ]
          SUBTITLE_OLD = "if (subtitle != null) Text(subtitle, fontSize = 12.sp, color = Brand.Sub)"
          RUNAUTO = "private fun runAuto(c: Context, db: ClinicDb, force: Boolean): Boolean {"
          SAVED = 'r.getOrNull() == true -> "Backup saved ✓"'
          SIGN = 'signingConfig = signingConfigs.getByName("clinic")'
          LABEL_OLD = 'android:label="Mahalaxmi Dental Clinic"'

          check("theme", SUB_OLD)
          check("theme", FAINT_OLD)
          check("theme", POPPINS[0])
          for k in range(1, len(POPPINS)):
              check_near("theme", POPPINS[0], k, POPPINS[k])
          check("theme", EXT_OLD)
          for s in SERIF:
              check("theme", s + " = baseType." + s + ".poppins(),")
          check("theme", THEME_OLD)
          check("theme", ICONS_NOTE)
          for old, new in TITLES:
              check("theme", old)
          check("theme", SUBTITLE_OLD, 2)
          check("backup", RUNAUTO)
          check("screen", SAVED)
          check("gradle", "targetSdk = 35")
          check("gradle", SIGN)
          check_near("gradle", SIGN, 1, "}")
          check("manifest", LABEL_OLD)

          for f in ["lato_regular", "lato_bold", "merriweather_regular", "merriweather_bold"]:
              if glob.glob("app/src/main/res/font/" + f + ".*"):
                  print("OK       font file " + f)
              else:
                  print("MISSING  font file " + f)
                  problems.append(f)

          kt_files = glob.glob("app/src/main/**/*.kt", recursive=True)
          for word in ["ClinicTextFont", "ClinicTitleFont", "serifTitle", "isTestApp"]:
              for p in kt_files:
                  if word in open(p, encoding="utf-8").read():
                      print("FOUND    " + word + " is already in " + p)
                      problems.append(word)

          joined = "\n".join(text["gradle"])
          code = re.search(r"versionCode = (\d+)", joined)
          vname = re.search(r'versionName = "(\d+)\.0"', joined)
          if code and vname and code.group(1) == vname.group(1):
              print("OK       version " + code.group(1))
          else:
              print("MISSING  versionCode and versionName lines")
              problems.append("version")

          if problems:
              stop("Some lines did not match.")

          def indent_of(line):
              return line[:len(line) - len(line.lstrip())]

          def put(ind, new_lines):
              return [(ind + n) if n else "" for n in new_lines]

          def replace(key, old, new_lines):
              lines = text[key]
              for i in reversed(where(key, old)):
                  lines[i:i + 1] = put(indent_of(lines[i]), new_lines)

          # Theme.kt: darker grey text
          replace("theme", SUB_OLD, ["val Sub: Color get() = if (d) Color(0xFFB4BCB8) else Color(0xFF555B59)"])
          replace("theme", FAINT_OLD, ["val Faint: Color get() = if (d) Color(0xFF86908B) else Color(0xFF8A918D)"])

          # Theme.kt: Lato for text, Merriweather for titles
          lines = text["theme"]
          i = where("theme", POPPINS[0])[0]
          lines[i:i + len(POPPINS)] = put(indent_of(lines[i]), [
              "/** Lato for all text and Merriweather for titles: the pair chosen for the Home screen, now on every screen. */",
              "val ClinicTextFont = FontFamily(",
              "    Font(R.font.lato_regular, FontWeight.Normal),",
              "    Font(R.font.lato_bold, FontWeight.Bold)",
              ")",
              "val ClinicTitleFont = FontFamily(",
              "    Font(R.font.merriweather_regular, FontWeight.Normal),",
              "    Font(R.font.merriweather_bold, FontWeight.Bold)",
              ")",
              "",
              "/** Old name kept on purpose: every screen that still asks for Poppins now gets Lato. */",
              "val Poppins = ClinicTextFont",
          ])
          replace("theme", EXT_OLD, [
              "private fun TextStyle.poppins(): TextStyle = copy(fontFamily = ClinicTextFont)",
              "private fun TextStyle.serifTitle(): TextStyle = copy(fontFamily = ClinicTitleFont)",
          ])
          for s in SERIF:
              replace("theme", s + " = baseType." + s + ".poppins(),", [s + " = baseType." + s + ".serifTitle(),"])
          for old, new in TITLES:
              replace("theme", old, [new])
          replace("theme", SUBTITLE_OLD, ["if (subtitle != null) Text(subtitle, fontSize = 13.sp, color = Brand.Sub)"])

          # Theme.kt: the TEST app gets a gold strip at the top of every screen
          replace("theme", THEME_OLD, [
              "val testApp = isTestApp(LocalContext.current)",
              "MaterialTheme(colorScheme = scheme, typography = AppTypography) {",
              "    ScaledForTablets {",
              "        if (testApp) {",
              "            // Gold strip behind the clock and battery: this is the TEST app, not the clinic app",
              "            Box(Modifier.fillMaxSize()) {",
              "                content()",
              "                Box(Modifier.fillMaxWidth().windowInsetsTopHeight(WindowInsets.statusBars).background(Brand.Gold))",
              "            }",
              "        } else {",
              "            content()",
              "        }",
              "    }",
              "}",
          ])
          lines = text["theme"]
          i = where("theme", ICONS_NOTE)[0]
          lines[i:i] = put(indent_of(lines[i]), [
              "/** True in the TEST copy of the app, which has its own name and data and never writes backups. */",
              'fun isTestApp(context: Context): Boolean = context.packageName.endsWith(".test")',
              "",
          ])

          # Backup.kt and BackupScreen.kt: the TEST app never writes backups
          lines = text["backup"]
          i = where("backup", RUNAUTO)[0]
          lines[i + 1:i + 1] = put(indent_of(lines[i]) + "    ", ["if (isTestApp(c)) return false   // the TEST app never writes backups"])
          lines = text["screen"]
          i = where("screen", SAVED)[0]
          lines[i:i] = put(indent_of(lines[i]), ['isTestApp(context) -> "Backups are off in the TEST app"'])

          # build.gradle.kts and AndroidManifest.xml: the TEST app
          lines = text["gradle"]
          i = where("gradle", "targetSdk = 35")[0]
          lines[i + 1:i + 1] = put(indent_of(lines[i]), ['manifestPlaceholders["appLabel"] = "Mahalaxmi Dental Clinic"'])
          i = where("gradle", SIGN)[0] + 1
          lines[i + 1:i + 1] = put(indent_of(lines[i]), [
              "// The TEST app: its own name and its own data, installed next to the clinic app",
              'create("tester") {',
              '    initWith(getByName("release"))',
              '    applicationIdSuffix = ".test"',
              '    versionNameSuffix = "-test"',
              '    manifestPlaceholders["appLabel"] = "Mahalaxmi TEST"',
              "}",
          ])
          replace("manifest", LABEL_OLD, ['android:label="${appLabel}"'])

          n = int(code.group(1))
          joined = "\n".join(text["gradle"])
          joined = joined.replace("versionCode = %d" % n, "versionCode = %d" % (n + 1), 1)
          joined = joined.replace('versionName = "%d.0"' % n, 'versionName = "%d.0"' % (n + 1), 1)
          text["gradle"] = joined.split("\n")

          for key, path in files.items():
              if key != "drive":
                  open(path, "w", encoding="utf-8").write("\n".join(text[key]))
                  print("Changed  " + path)
          print("Version %d -> %d" % (n, n + 1))

          for p in kt_files:
              for num, l in enumerate(open(p, encoding="utf-8").read().split("\n"), 1):
                  if "fileprovider" in l and '"com.mahalakshmi' in l:
                      print("NOTE     " + p + " line %d names the file-sharing provider by hand" % num)
          print("NOTE     Drive backup fix: " + ("installed" if "fun listBackups(" in "\n".join(text["drive"]) else "NOT installed yet"))
          print("ALL DONE")
          PY_END

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lato and Merriweather on every screen, darker grey text, TEST app"
          git push
