name: Real teeth chart (one time)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch to the new dental chart
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          SRC = pathlib.Path("app/src/main/java/com/mahalakshmi/dental")
          chart = SRC / "DentalChart.kt"
          if not chart.exists() or "fun TeethChart" not in chart.read_text(encoding="utf-8"):
              print("Paste the new DentalChart.kt first, then run this again.")
              sys.exit(1)

          problems = []
          renames = [
              ("PatientSheets.kt",
               "fun StatusChart(statusByTooth: Map<String, Int>, onTooth: (String) -> Unit) {",
               "fun OldStatusChart(statusByTooth: Map<String, Int>, onTooth: (String) -> Unit) {"),
              ("VisitScreen.kt",
               "fun ToothChart(selected: List<String>, onToggle: (String) -> Unit) {",
               "fun OldToothChart(selected: List<String>, onToggle: (String) -> Unit) {"),
          ]
          for name, old, new in renames:
              p = SRC / name
              t = p.read_text(encoding="utf-8")
              if t.count(old) != 1:
                  problems.append("%s: the old chart was not found" % name)
                  continue
              p.write_text(t.replace(old, new), encoding="utf-8")
              print("Old chart retired in", name)

          if problems:
              print("\n".join(problems))
              sys.exit(1)

          gradle = pathlib.Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          code = int(re.search(r"versionCode\s*=\s*(\d+)", g).group(1)) + 1
          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = %d" % code, g, count=1)
          g = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "%d.0"' % code, g, count=1)
          gradle.write_text(g, encoding="utf-8")
          print("All done. Version is now %d.0" % code)
          PY

      - name: Save the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Real teeth in the dental chart"
          git push

      - name: Start the APK build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"
