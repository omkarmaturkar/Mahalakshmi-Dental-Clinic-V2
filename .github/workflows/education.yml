name: Patient education (one time)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the education library
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          SRC = pathlib.Path("app/src/main/java/com/mahalakshmi/dental")
          new = SRC / "Education.kt"
          if not new.exists() or "fun EducationCard" not in new.read_text(encoding="utf-8"):
              print("Paste the new Education.kt first, then run this again.")
              sys.exit(1)

          p = SRC / "PatientScreens.kt"
          t = p.read_text(encoding="utf-8")
          if "EducationCard(db, patientId)" in t:
              print("The education card is already in the patient file.")
          else:
              old_phone = "PerioCard(db, patientId) }"
              if t.count(old_phone) != 1:
                  print("Run the Stage 2 tool (Gum chart) first.")
                  sys.exit(1)
              lines = t.split("\n")
              hits = [i for i, l in enumerate(lines) if l.strip() == "PerioCard(db, patientId)"]
              if len(hits) != 1:
                  print("Could not find the right place in PatientScreens.kt (found %d)." % len(hits))
                  sys.exit(1)
              i = hits[0]
              indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
              lines.insert(i + 1, indent + "EducationCard(db, patientId)")
              t = "\n".join(lines)
              t = t.replace(old_phone, "PerioCard(db, patientId); EducationCard(db, patientId) }")
              p.write_text(t, encoding="utf-8")
              print("Education card added to the patient file")

          gradle = pathlib.Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          code = int(re.search(r"versionCode\s*=\s*(\d+)", g).group(1)) + 1
          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = %d" % code, g, count=1)
          g = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "%d.0"' % code, g, count=1)
          gradle.write_text(g, encoding="utf-8")
          print("All done. Version is now %d.0" % code)
          PY

      - name: Save the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Patient education library"
          git push

      - name: Start the APK build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"
