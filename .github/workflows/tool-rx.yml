name: Tool - IDs on prescriptions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every line, then change Prescription.kt
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          KT = pathlib.Path('app/src/main/java/com/mahalakshmi/dental')
          GRADLE = pathlib.Path('app/build.gradle.kts')

          # Each change in Prescription.kt: the lines that must be there now, the lines that replace them
          CHANGES = [
              (['patient.gender, if (patient.age.isNotBlank()) "${patient.age} yrs" else "",'],
               ['                            patientCode(patient.id), patient.gender, if (patient.age.isNotBlank()) "${patient.age} yrs" else "",']),
              (['Text(info, fontSize = 12.sp, color = Brand.Sub)'],
               ['                        Text(info, fontSize = 12.sp, color = Brand.Sub)',
                '                        Text("OPD No. " + opdId(patientId, epochDayOf(createdAt)), fontSize = 12.sp, color = Brand.Sub)']),
              (['pdf.title("PRESCRIPTION", "Date: ${fmtDate(rx.date)}")', 'pdf.patientBox(patient)'],
               ['    pdf.title("PRESCRIPTION", "")',
                '    pdf.partyBox(',
                '        "PATIENT DETAILS", listOf(',
                '            "Name" to patient.name,',
                '            "Age / Sex" to listOf(if (patient.age.isNotBlank()) "${patient.age} yrs" else "", patient.gender)',
                '                .filter { it.isNotBlank() }.joinToString(" / "),',
                '            "Mobile" to patient.phone,',
                '            "Patient ID" to patientCode(patient.id)',
                '        ),',
                '        "PRESCRIPTION DETAILS", listOf(',
                '            "Rx No." to docNo("RX-", rx.id),',
                '            "OPD No." to opdId(rx.patientId, epochDayOf(rx.date)),',
                '            "Date" to fmtDate(rx.date),',
                '            "Consultant" to (db.mainDoctor()?.name ?: db.clinicInfo().name)',
                '        )',
                '    )']),
          ]

          problems = []
          helpers = KT / 'AppHelpers.kt'
          if not helpers.is_file() or 'fun opdId(' not in helpers.read_text(encoding='utf-8'):
              problems.append('AppHelpers.kt with the patient IDs is missing: run the earlier tool (tool-v37.yml) first')

          path = KT / 'Prescription.kt'
          lines = path.read_text(encoding='utf-8').split('\n') if path.is_file() else None
          found = []
          if lines is None:
              problems.append('Prescription.kt was not found')
          else:
              for old, new in CHANGES:
                  hits = [i for i in range(len(lines) - len(old) + 1)
                          if all(lines[i + k].strip() == old[k] for k in range(len(old)))]
                  if len(hits) != 1:
                      problems.append('Prescription.kt: expected once, found %d times: %s' % (len(hits), ' | '.join(old)))
                  else:
                      found.append((hits[0], len(old), new))

          gradle = GRADLE.read_text(encoding='utf-8').split('\n') if GRADLE.is_file() else []
          code = [i for i, l in enumerate(gradle) if re.fullmatch(r'\s*versionCode\s*=\s*\d+\s*', l)]
          vname = [i for i, l in enumerate(gradle) if re.fullmatch(r'\s*versionName\s*=\s*"\d+\.0"\s*', l)]
          if len(code) != 1 or len(vname) != 1:
              problems.append('app/build.gradle.kts: versionCode / versionName lines not found exactly once')

          if problems:
              print('NOTHING WAS CHANGED')
              for p in problems:
                  print(' - ' + p)
              sys.exit(1)

          for start, count, new in sorted(found, key=lambda f: -f[0]):
              lines[start:start + count] = new
          path.write_text('\n'.join(lines), encoding='utf-8')
          version = int(re.search(r'\d+', gradle[code[0]]).group(0)) + 1
          gradle[code[0]] = re.sub(r'\d+', str(version), gradle[code[0]], count=1)
          gradle[vname[0]] = re.sub(r'"\d+\.0"', '"%d.0"' % version, gradle[vname[0]], count=1)
          GRADLE.write_text('\n'.join(gradle), encoding='utf-8')
          print('Prescriptions now show the patient ID and OPD No. New version: %d' % version)
          PY

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Patient ID and OPD No. on prescriptions"
          git push
