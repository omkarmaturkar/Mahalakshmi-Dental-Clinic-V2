name: Mouth status (one time)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add mouth status to the app
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          SRC = pathlib.Path("app/src/main/java/com/mahalakshmi/dental")
          new = SRC / "MouthStatus.kt"
          if not new.exists() or "fun MouthStatusCard" not in new.read_text(encoding="utf-8"):
              print("Paste the new MouthStatus.kt first, then run this again.")
              sys.exit(1)

          # 1. Patient file: Mouth status card between the treatments and the gum chart
          p = SRC / "PatientScreens.kt"
          t = p.read_text(encoding="utf-8")
          if "MouthStatusCard(db, patientId)" in t:
              print("Mouth status is already in the patient file.")
          else:
              old_phone = "treatmentsCard(); PerioCard(db, patientId) }"
              if t.count(old_phone) != 1:
                  print("Run the Stage 2 tool (Gum chart) first.")
                  sys.exit(1)
              lines = t.split("\n")
              hits = [i for i, l in enumerate(lines) if l.strip() == "PerioCard(db, patientId)"]
              if len(hits) != 1:
                  print("Could not find the right place in PatientScreens.kt (found %d)." % len(hits))
                  sys.exit(1)
              i = hits[0]
              indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
              lines.insert(i, indent + "MouthStatusCard(db, patientId)")
              t = "\n".join(lines)
              t = t.replace(old_phone, "treatmentsCard(); MouthStatusCard(db, patientId); PerioCard(db, patientId) }")
              p.write_text(t, encoding="utf-8")
              print("Mouth status added to the patient file")

          # 2. Gum chart: skip teeth marked missing in mouth status
          perio = SRC / "Perio.kt"
          if perio.exists():
              pt = perio.read_text(encoding="utf-8")
              if "mouthStatusOf(patientId)" in pt:
                  print("Gum chart already uses mouth status.")
              else:
                  lines = pt.split("\n")
                  done = False
                  for i, l in enumerate(lines):
                      if '"extract" in it.name.lowercase()' in l and i > 0 and lines[i - 1].strip() == "treatmentsOf(patientId)":
                          indent = lines[i - 1][: len(lines[i - 1]) - len(lines[i - 1].lstrip())]
                          lines.insert(i - 1, indent + "runCatching { mouthStatusOf(patientId) }.getOrDefault(emptyList()).filter { it.missing }.forEach { missing.add(it.tooth) }")
                          done = True
                          break
                  if done:
                      perio.write_text("\n".join(lines), encoding="utf-8")
                      print("Gum chart now skips missing teeth from mouth status")
                  else:
                      print("Note: could not link the gum chart (not needed for mouth status to work).")

          # 3. Version
          gradle = pathlib.Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          code = int(re.search(r"versionCode\s*=\s*(\d+)", g).group(1)) + 1
          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = %d" % code, g, count=1)
          g = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "%d.0"' % code, g, count=1)
          gradle.write_text(g, encoding="utf-8")
          print("All done. Version is now %d.0" % code)
          PY

      - name: Save the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mouth status with tooth surfaces"
          git push

      - name: Start the APK build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"
