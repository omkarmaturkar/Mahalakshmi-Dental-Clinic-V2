name: App lock and instant backup (one time)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the libraries and the menu item
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          SRC = pathlib.Path("app/src/main/java/com/mahalakshmi/dental")
          problems = []

          for name, marker in [("Security.kt", "object AppLock"), ("MainActivity.kt", "LockGate"),
                               ("FinanceScreen.kt", "DateRangePicker")]:
              p = SRC / name
              if not p.exists() or marker not in p.read_text(encoding="utf-8"):
                  problems.append("Paste the new %s first, then run this again." % name)
          if problems:
              print("\n".join(problems))
              sys.exit(1)

          def insert_after(text, marker, new_lines, where):
              lines = text.split("\n")
              hits = [i for i, l in enumerate(lines) if marker in l]
              if len(hits) != 1:
                  problems.append("%s: found %d lines with: %s" % (where, len(hits), marker))
                  return text
              i = hits[0]
              indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
              lines[i + 1:i + 1] = [indent + x for x in new_lines]
              return "\n".join(lines)

          # 1) Fingerprint and background-backup libraries, and the new version number
          gradle = pathlib.Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          if "androidx.biometric" not in g:
              g = insert_after(g, 'implementation("com.google.android.gms:play-services-auth:21.2.0")', [
                  'implementation("androidx.biometric:biometric:1.1.0")',
                  'implementation("androidx.fragment:fragment-ktx:1.8.5")',
                  'implementation("androidx.work:work-runtime-ktx:2.9.1")',
              ], "build.gradle.kts")
          code = int(re.search(r"versionCode\s*=\s*(\d+)", g).group(1)) + 1
          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = %d" % code, g, count=1)
          g = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "%d.0"' % code, g, count=1)
          gradle.write_text(g, encoding="utf-8")

          # 2) "App lock" in the menu, under Appearance
          menu = SRC / "Menu.kt"
          m = menu.read_text(encoding="utf-8")
          if "AppLockRow()" not in m:
              m = insert_after(m, "AppearanceRow()", ["AppLockRow()"], "Menu.kt")
          menu.write_text(m, encoding="utf-8")

          # 3) Backup screen wording: no longer "daily"
          backup = SRC / "BackupScreen.kt"
          b = backup.read_text(encoding="utf-8")
          b = b.replace('"Automatic daily backup", "Runs once a day when you close the app"',
                        '"Automatic backup", "Every time you close the app (waits for internet if needed)"')
          b = b.replace("copied to your Google Drive every day. ", "copied to your Google Drive every time you close the app. ")
          backup.write_text(b, encoding="utf-8")

          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("All done. Version is now %d.0" % code)
          PY

      - name: Save the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "App lock, instant backup and custom finance dates"
          git push

      - name: Start the APK build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"
