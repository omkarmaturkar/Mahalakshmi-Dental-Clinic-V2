name: Tool - Fix doubled fonts

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove the doubled font setting
        run: |
          cd app/src/main/java/com/mahalakshmi/dental
          echo "Lines to fix:"
          grep -n "fontFamily = DisplayFont, fontFamily = DisplayFont" *.kt || true
          sed -i 's/fontFamily = DisplayFont, fontFamily = DisplayFont, fontWeight = FontWeight.SemiBold, fontSize = 24.sp/fontFamily = DisplayFont, fontWeight = FontWeight.SemiBold, fontSize = 21.sp/g' *.kt
          sed -i 's/fontFamily = DisplayFont, fontFamily = DisplayFont,/fontFamily = DisplayFont,/g' *.kt
          echo "Still doubled (should say none):"
          grep -n "fontFamily = DisplayFont, fontFamily" *.kt || echo "none"

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git commit -am "Fix doubled font setting on titles"
          git push

      - name: Start the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main || echo "Please start Build APK yourself from the Actions page"
