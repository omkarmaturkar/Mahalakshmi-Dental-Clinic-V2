name: Tool - Heritage look (fonts and version)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the new fonts
        run: |
          mkdir -p app/src/main/res/font
          python3 - <<'PY'
          import re, urllib.request
          url = ("https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700"
                 "&family=Cormorant+Garamond:wght@500;600;700")
          req = urllib.request.Request(url, headers={"User-Agent": "curl/8.5.0"})
          css = urllib.request.urlopen(req).read().decode()
          names = {"Jost": "jost", "Cormorant Garamond": "cormorant"}
          weights = {"400": "regular", "500": "medium", "600": "semibold", "700": "bold"}
          picked = {}
          for block in re.findall(r"@font-face\s*\{(.*?)\}", css, re.S):
              fam = re.search(r"font-family:\s*'([^']+)'", block).group(1)
              w = re.search(r"font-weight:\s*(\d+)", block).group(1)
              src = re.search(r"url\((https://[^)]+)\)", block).group(1)
              rng = re.search(r"unicode-range:\s*([^;]+);", block)
              if (fam, w) not in picked or rng is None or "U+0000-00FF" in rng.group(1):
                  picked[(fam, w)] = src
          wanted = {"Jost": ["400", "500", "600", "700"], "Cormorant Garamond": ["500", "600", "700"]}
          for fam, ws in wanted.items():
              for w in ws:
                  src = picked.get((fam, w))
                  if not src:
                      raise SystemExit(f"Google Fonts did not send {fam} {w}")
                  data = urllib.request.urlopen(src).read()
                  if data[:4] not in (b"\x00\x01\x00\x00", b"true", b"OTTO"):
                      raise SystemExit(f"{fam} {w} did not arrive as a TTF file")
                  path = f"app/src/main/res/font/{names[fam]}_{weights[w]}.ttf"
                  with open(path, "wb") as f:
                      f.write(data)
                  print("Saved", path, len(data), "bytes")
          PY

      - name: Raise the version
        run: |
          python3 - <<'PY'
          import re
          p = "app/build.gradle.kts"
          s = open(p).read()
          code = int(re.search(r"versionCode\s*=?\s*(\d+)", s).group(1)) + 1
          s = re.sub(r"(versionCode\s*=?\s*)\d+", lambda m: m.group(1) + str(code), s, count=1)
          s = re.sub(r'(versionName\s*=?\s*")[^"]*"', lambda m: m.group(1) + f'{code}.0"', s, count=1)
          open(p, "w").write(s)
          print("Version is now", code)
          PY

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Heritage look: new fonts, version raised"
          git push
