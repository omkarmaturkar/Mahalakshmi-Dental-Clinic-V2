name: Braces case sheet (one time)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the braces case sheet
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          SRC = pathlib.Path("app/src/main/java/com/mahalakshmi/dental")
          new = SRC / "Ortho.kt"
          if not new.exists() or "fun OrthoCard" not in new.read_text(encoding="utf-8"):
              print("Paste the new Ortho.kt first, then run this again.")
              sys.exit(1)

          # 1. Patient file: braces card right after the treatment progress
          p = SRC / "PatientScreens.kt"
          t = p.read_text(encoding="utf-8")
          if "OrthoCard(db, patientId)" in t:
              print("The braces card is already in the patient file.")
          else:
              old_phone = "TreatmentProgress(db, patientId); treatmentsCard();"
              if t.count(old_phone) != 1:
                  print("Run the Stage 1 to 3 tools first.")
                  sys.exit(1)
              lines = t.split("\n")
              hits = [i for i, l in enumerate(lines) if l.strip() == "TreatmentProgress(db, patientId)"]
              if len(hits) != 1:
                  print("Could not find the right place in PatientScreens.kt (found %d)." % len(hits))
                  sys.exit(1)
              i = hits[0]
              indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
              lines.insert(i + 1, indent + "OrthoCard(db, patientId)")
              t = "\n".join(lines)
              t = t.replace(old_phone, "TreatmentProgress(db, patientId); OrthoCard(db, patientId); treatmentsCard();")
              p.write_text(t, encoding="utf-8")
              print("Braces card added to the patient file")

          # 2. Sittings: braces are now handled by the case sheet
          s = SRC / "Sittings.kt"
          if s.exists():
              lines = s.read_text(encoding="utf-8").split("\n")
              for i, l in enumerate(lines):
                  if '"brace" in n' in l and i + 1 < len(lines) and 'listOf("Braces fitting"' in lines[i + 1]:
                      del lines[i:i + 2]
                      s.write_text("\n".join(lines), encoding="utf-8")
                      print("Braces removed from the sittings suggestions")
                      break

          # 3. Version
          gradle = pathlib.Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          code = int(re.search(r"versionCode\s*=\s*(\d+)", g).group(1)) + 1
          g = re.sub(r"versionCode\s*=\s*\d+", "versionCode = %d" % code, g, count=1)
          g = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "%d.0"' % code, g, count=1)
          gradle.write_text(g, encoding="utf-8")
          print("All done. Version is now %d.0" % code)
          PY

      - name: Save the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Braces case sheet"
          git push

      - name: Start the APK build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"
