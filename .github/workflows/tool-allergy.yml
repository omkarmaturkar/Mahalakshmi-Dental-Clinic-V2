name: tool-allergy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the new file
        run: |
          mkdir -p /tmp/new
          cat > /tmp/new/Allergies.kt <<'KT_END'
          @file:OptIn(ExperimentalLayoutApi::class)

          package com.mahalakshmi.dental

          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.Warning
          import androidx.compose.material3.Icon
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.Dialog

          // ───────────── Allergies ─────────────
          // Saved with the patient's medical alerts as "Allergy: Penicillin", so they show in red everywhere.
          // Older alerts typed as "Penicillin allergy" are understood too.

          val allergyOptions = listOf(
              "Penicillin", "Sulfa drugs", "Painkillers (NSAIDs)", "Aspirin", "Metronidazole", "Local anaesthetic", "Latex"
          )

          private val allergyPatterns = listOf(
              Regex("^allergy\\s*[:\\-]\\s*(.+)$", RegexOption.IGNORE_CASE),
              Regex("^allergic to\\s+(.+)$", RegexOption.IGNORE_CASE),
              Regex("^(.+?)\\s+allergy$", RegexOption.IGNORE_CASE)
          )
          private val notAllergyNames = setOf("drug", "drugs", "medicine", "medicines", "food", "no", "no known", "any")

          /** The allergy named in a medical alert ("Penicillin" in "Allergy: Penicillin"), or null if it is not an allergy. */
          fun allergyName(alert: String): String? {
              val t = alert.trim()
              for (p in allergyPatterns) {
                  val name = p.find(t)?.groupValues?.get(1)?.trim()
                  if (!name.isNullOrEmpty() && name.lowercase() !in notAllergyNames) return name
              }
              return null
          }

          /** All allergies among a patient's medical alerts. */
          fun allergiesIn(alerts: List<String>): List<String> = alerts.mapNotNull { allergyName(it) }.distinct()

          // Which medicines belong to each allergy. Doctor sir can check this list in the TEST app.
          private class AllergyGroup(val names: List<String>, val medicines: List<String>)

          private val allergyGroups = listOf(
              AllergyGroup(
                  listOf("penicillin", "amoxicillin", "amoxycillin", "augmentin"),
                  listOf("cillin", "augmentin", "clavulan", "clavam", "amoxyclav", "amoxiclav")
              ),
              AllergyGroup(
                  listOf("sulfa", "sulpha"),
                  listOf("sulfa", "sulpha", "cotrimoxazole", "co-trimoxazole", "septran", "bactrim")
              ),
              AllergyGroup(
                  listOf("nsaid", "painkiller", "ibuprofen", "diclofenac"),
                  listOf(
                      "ibuprofen", "diclofenac", "aceclofenac", "ketorolac", "naproxen", "nimesulide", "mefenamic", "aspirin",
                      "etoricoxib", "piroxicam", "indomethacin", "ketoprofen", "flurbiprofen", "combiflam", "brufen", "voveran",
                      "zerodol", "meftal", "dolonex", "ketorol", "ecosprin", "disprin"
                  )
              ),
              AllergyGroup(listOf("aspirin"), listOf("aspirin", "ecosprin", "disprin", "acetylsalicylic")),
              AllergyGroup(
                  listOf("metronidazole", "metrogyl", "flagyl"),
                  listOf("metronidazole", "metrogyl", "flagyl", "tinidazole", "ornidazole")
              ),
              AllergyGroup(
                  listOf("anaesthetic", "anesthetic", "lignocaine", "lidocaine", "xylocaine"),
                  listOf("lignocaine", "lidocaine", "xylocaine", "benzocaine", "articaine", "bupivacaine", "prilocaine")
              )
          )

          /** The allergy that a medicine may clash with, or null when it looks safe. */
          fun allergyClash(allergies: List<String>, medicine: String): String? {
              val med = medicine.lowercase()
              for (a in allergies) {
                  val name = a.lowercase()
                  val words = allergyGroups.filter { g -> g.names.any { name.contains(it) } }.flatMap { it.medicines }.toMutableList()
                  if (name.length >= 4) words.add(name)
                  if (words.any { med.contains(it) }) return a
              }
              return null
          }

          // ───────────── Patient form ─────────────
          /** Allergy chips on the patient form. Tapping one adds or removes "Allergy: …" in the medical alerts. */
          @Composable
          fun AllergiesCard(medical: MutableList<String>) {
              var other by remember { mutableStateOf("") }
              val chosen = medical.mapNotNull { allergyName(it) }
              FormCard("Allergies", "Shown in red on every prescription, with a warning before a matching medicine") {
                  FlowRow(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      (allergyOptions + chosen.filter { c -> allergyOptions.none { it.equals(c, ignoreCase = true) } }).forEach { a ->
                          val on = chosen.any { it.equals(a, ignoreCase = true) }
                          ChoiceChip(a, on, selectedBg = Brand.Red) {
                              if (on) {
                                  medical.removeAll(medical.filter { allergyName(it)?.equals(a, ignoreCase = true) == true })
                              } else {
                                  medical.add("Allergy: $a")
                              }
                          }
                      }
                  }
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      AppField(other, { other = it }, "Other allergy, e.g. Iodine", Modifier.weight(1f))
                      Spacer(Modifier.width(10.dp))
                      CircleIconButton(
                          Icons.Filled.Add,
                          {
                              val a = other.trim().replace(",", " ")
                              if (a.isNotEmpty() && chosen.none { it.equals(a, ignoreCase = true) }) medical.add("Allergy: $a")
                              other = ""
                          },
                          bg = Brand.RedSoft, tint = Brand.Red, size = 54.dp
                      )
                  }
              }
          }

          // ───────────── Prescription ─────────────
          /** The red strip on the prescription: allergies first, then the other medical alerts. */
          @Composable
          fun RowScope.AlertLines(alerts: List<String>) {
              val allergies = allergiesIn(alerts)
              val others = alerts.filter { allergyName(it) == null }
              Column(Modifier.weight(1f)) {
                  if (allergies.isNotEmpty()) {
                      Text("Allergic to: " + allergies.joinToString(", "), fontSize = 14.sp, color = Brand.Red, fontWeight = FontWeight.Bold)
                  }
                  if (others.isNotEmpty()) {
                      Text("Medical alerts: " + others.joinToString(", "), fontSize = 13.sp, color = Brand.Red, fontWeight = FontWeight.Medium)
                  }
              }
          }

          /** "What we found" with BP and sugar boxes on top. */
          @Composable
          fun FindingsVitalsCard(
              text: String,
              bp: String,
              sugar: String,
              onBp: (String) -> Unit,
              onSugar: (String) -> Unit,
              onChange: (String) -> Unit
          ) {
              FormCard("What we found", "On examination (optional)") {
                  Row {
                      AppField(bp, { v -> onBp(v.filter { it.isDigit() || it == '/' }.take(7)) }, "BP, e.g. 120/80", Modifier.weight(1f))
                      Spacer(Modifier.width(12.dp))
                      AppField(
                          sugar, { v -> onSugar(v.filter { it.isDigit() }.take(3)) }, "Sugar (mg/dL)", Modifier.weight(1f),
                          type = KeyboardType.Number
                      )
                  }
                  AppField(text, onChange, "Findings, e.g. deep cavity in 46, tender on tapping", lines = 2)
              }
          }

          /** Shown before adding a medicine that may clash with the patient's allergy. */
          @Composable
          fun AllergyWarningDialog(
              patientName: String,
              medicine: String,
              allergy: String,
              onKeepOut: () -> Unit,
              onAddAnyway: () -> Unit
          ) {
              val first = patientName.trim().substringBefore(" ").ifBlank { "This patient" }
              Dialog(onDismissRequest = onKeepOut) {
                  Column(
                      Modifier.widthIn(max = 460.dp).fillMaxWidth().clip(RoundedCornerShape(28.dp))
                          .background(Brand.Surface).padding(26.dp)
                  ) {
                      Box(
                          Modifier.size(56.dp).clip(CircleShape).background(Brand.RedSoft),
                          contentAlignment = Alignment.Center
                      ) { Icon(Icons.Filled.Warning, null, tint = Brand.Red) }
                      Spacer(Modifier.height(16.dp))
                      Text("Allergy alert", fontFamily = ClinicTitleFont, fontWeight = FontWeight.SemiBold, fontSize = 20.sp, color = Brand.Ink)
                      Spacer(Modifier.height(6.dp))
                      Text("$first is allergic to $allergy. $medicine may cause a reaction.", fontSize = 15.sp, color = Brand.Ink)
                      Spacer(Modifier.height(24.dp))
                      GradientButton("Don't add", Modifier.fillMaxWidth(), height = 52.dp, onClick = onKeepOut)
                      Spacer(Modifier.height(6.dp))
                      Text(
                          "Add anyway", color = Brand.Red, fontWeight = FontWeight.Medium, fontSize = 15.sp, textAlign = TextAlign.Center,
                          modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).clickable(onClick = onAddAnyway)
                              .padding(vertical = 12.dp)
                      )
                  }
              }
          }
          KT_END

      - name: Check every line, then change
        run: |
          python3 - <<'PY_END'
          import glob, os, re, shutil, sys

          def stop(msg):
              print(msg)
              print("NOTHING WAS CHANGED")
              sys.exit(1)

          def find(name):
              hits = glob.glob("app/src/main/**/" + name, recursive=True)
              if len(hits) != 1:
                  stop("Could not find exactly one " + name + " (found %d)" % len(hits))
              return hits[0]

          files = {"edit": find("PatientEdit.kt"), "rx": find("Prescription.kt"), "gradle": "app/build.gradle.kts"}
          text = {}
          for key, path in files.items():
              if not os.path.exists(path):
                  stop("Missing file: " + path)
              text[key] = open(path, encoding="utf-8").read().split("\n")
          new_path = os.path.join(os.path.dirname(files["rx"]), "Allergies.kt")

          problems = []

          def where(key, old):
              return [i for i, l in enumerate(text[key]) if l.strip() == old]

          def check(key, old, count=1):
              n = len(where(key, old))
              if n == count:
                  print("OK       " + files[key] + ":  " + old)
              else:
                  print("MISSING  " + files[key] + ":  " + old + "  (found %d, expected %d)" % (n, count))
                  problems.append(old)

          def check_near(key, old, offset, expected):
              hits = where(key, old)
              lines = text[key]
              if len(hits) == 1 and 0 <= hits[0] + offset < len(lines) and lines[hits[0] + offset].strip() == expected:
                  print("OK       " + files[key] + ":  " + expected)
              else:
                  print("MISSING  " + files[key] + ":  " + expected + "  (next to: " + old + ")")
                  problems.append(expected)

          E1 = "(medicalOptions + medical.filter { it !in medicalOptions }).forEach { m ->"
          E2 = 'AppField(otherAlert, { otherAlert = it }, "Other, e.g. Penicillin allergy", Modifier.weight(1f))'
          E3 = "if (more) {"
          R1 = 'val findings: String = ""'
          R2 = 'if ("findings" !in have) sql.execSQL("ALTER TABLE prescriptions ADD COLUMN findings TEXT")'
          R3 = 'private const val RX_COLS = "id, patient_id, visit_id, date, diagnosis, medicines, advice, complaint, findings"'
          R4 = 'complaint = c.getString(7) ?: "", findings = c.getString(8) ?: ""'
          R5 = 'put("findings", rx.findings)'
          R6 = 'var findings by remember { mutableStateOf(existing?.findings ?: "") }'
          R7 = "val canSave = medicines.isNotEmpty() || diagnosis.isNotBlank() || advice.isNotBlank() || complaint.isNotBlank() || findings.isNotBlank()"
          R8 = "complaint = complaint.trim(), findings = findings.trim()"
          R9 = '"Medical alerts: " + patient.alerts.joinToString(", "),'
          R10 = "FindingsCard(findings) { findings = it }"
          R11 = "MedicineRow(i + 1, m, onEdit = { editing = i }, onRemove = { medicines.removeAt(i) })"
          R12 = "private fun MedicineRow(number: Int, m: Medicine, onEdit: () -> Unit, onRemove: () -> Unit) {"
          R13 = "Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).background(Brand.Soft).clickable(onClick = onEdit).padding(12.dp),"
          R14 = "Text(m.name, fontSize = 15.sp, fontWeight = FontWeight.SemiBold, color = Brand.Ink)"
          R15 = "if (index in medicines.indices) medicines[index] = m else medicines.add(m)"
          R16 = "if (askTemplateName) {"
          R17 = 'pdf.text("Medical alerts: " + patient.alerts.joinToString(", "), 10f, PdfRed, 1, after = 8f)'
          R18 = "if (rx.findings.isNotBlank()) {"

          check("edit", E1)
          check("edit", E2)
          check("edit", E3)
          for old in [R1, R2, R3, R4, R5, R6, R7, R8, R9, R11, R12, R13, R14, R15, R16, R17, R18]:
              check("rx", old)
          check("rx", R10, 2)
          check_near("rx", R9, -1, "Text(")
          check_near("rx", R9, 1, "fontSize = 13.sp, color = Brand.Red, fontWeight = FontWeight.Medium")
          check_near("rx", R9, 2, ")")
          check_near("rx", R18, 1, 'pdf.text("On examination", 9.5f, PdfSub, 1, after = 1f)')
          check_near("rx", R18, 2, "pdf.text(rx.findings, 11f, after = 10f)")
          check_near("rx", R18, 3, "}")

          kt_files = glob.glob("app/src/main/**/*.kt", recursive=True)
          everything = ""
          for p in kt_files:
              everything += open(p, encoding="utf-8").read()
          for word in ["allergyOptions", "allergyName(", "allergiesIn(", "allergyClash(", "AllergiesCard(", "AlertLines(",
                       "AllergyWarningDialog(", "FindingsVitalsCard(", "AllergyGroup", "allergyGroups", "allergyPatterns", "notAllergyNames"]:
              if word in everything:
                  print("FOUND    " + word + " is already in the app")
                  problems.append(word)
          if "val ClinicTitleFont" not in everything:
              print("MISSING  ClinicTitleFont (from the font tool last time)")
              problems.append("ClinicTitleFont")
          if os.path.exists(new_path):
              print("FOUND    " + new_path + " already exists")
              problems.append("Allergies.kt")
          new_text = open("/tmp/new/Allergies.kt", encoding="utf-8").read()
          if "fun AllergyWarningDialog(" not in new_text or not new_text.rstrip().endswith("}"):
              print("PROBLEM  the new Allergies.kt was not written fully")
              problems.append("new file")

          joined = "\n".join(text["gradle"])
          code = re.search(r"versionCode = (\d+)", joined)
          vname = re.search(r'versionName = "(\d+)\.0"', joined)
          if code and vname and code.group(1) == vname.group(1):
              print("OK       version " + code.group(1))
          else:
              print("MISSING  versionCode and versionName lines")
              problems.append("version")

          if problems:
              stop("Some lines did not match.")

          def indent_of(line):
              return line[:len(line) - len(line.lstrip())]

          def put(ind, new_lines):
              return [(ind + n) if n else "" for n in new_lines]

          def replace(key, old, new_lines):
              lines = text[key]
              for i in reversed(where(key, old)):
                  lines[i:i + 1] = put(indent_of(lines[i]), new_lines)

          def insert_after(key, old, new_lines):
              lines = text[key]
              i = where(key, old)[0]
              lines[i + 1:i + 1] = put(indent_of(lines[i]), new_lines)

          def insert_before(key, old, new_lines):
              lines = text[key]
              i = where(key, old)[0]
              lines[i:i] = put(indent_of(lines[i]), new_lines)

          # PatientEdit.kt: allergies get their own card
          replace("edit", E1, ["(medicalOptions + medical.filter { it !in medicalOptions && allergyName(it) == null }).forEach { m ->"])
          replace("edit", E2, ['AppField(otherAlert, { otherAlert = it }, "Other, e.g. Asthma", Modifier.weight(1f))'])
          insert_before("edit", E3, ["AllergiesCard(medical)"])

          # Prescription.kt: BP and sugar are saved with each prescription
          replace("rx", R1, ['val findings: String = "",', 'val bp: String = "",', 'val sugar: String = ""'])
          insert_after("rx", R2, [
              'if ("bp" !in have) sql.execSQL("ALTER TABLE prescriptions ADD COLUMN bp TEXT")',
              'if ("sugar" !in have) sql.execSQL("ALTER TABLE prescriptions ADD COLUMN sugar TEXT")',
          ])
          replace("rx", R3, ['private const val RX_COLS = "id, patient_id, visit_id, date, diagnosis, medicines, advice, complaint, findings, bp, sugar"'])
          replace("rx", R4, ['complaint = c.getString(7) ?: "", findings = c.getString(8) ?: "",', 'bp = c.getString(9) ?: "", sugar = c.getString(10) ?: ""'])
          insert_after("rx", R5, ['put("bp", rx.bp)', 'put("sugar", rx.sugar)'])
          insert_after("rx", R6, [
              'var bp by remember { mutableStateOf(existing?.bp ?: "") }',
              'var sugar by remember { mutableStateOf(existing?.sugar ?: "") }',
              "val allergies = remember { allergiesIn(patient.alerts) }",
              "var allergyCheck by remember { mutableStateOf<Triple<Int, Medicine, String>?>(null) }",
          ])
          replace("rx", R7, ["val canSave = medicines.isNotEmpty() || diagnosis.isNotBlank() || advice.isNotBlank() || complaint.isNotBlank() || findings.isNotBlank() || bp.isNotBlank() || sugar.isNotBlank()"])
          replace("rx", R8, ["complaint = complaint.trim(), findings = findings.trim(),", "bp = bp.trim(), sugar = sugar.trim()"])

          # Prescription.kt: red strip shows allergies first
          lines = text["rx"]
          i = where("rx", R9)[0]
          lines[i - 1:i + 3] = put(indent_of(lines[i - 1]), ["AlertLines(patient.alerts)"])

          # Prescription.kt: BP and sugar boxes, and allergy marks on medicines
          replace("rx", R10, ["FindingsVitalsCard(findings, bp, sugar, { bp = it }, { sugar = it }) { findings = it }"])
          replace("rx", R11, ["MedicineRow(i + 1, m, allergyClash(allergies, m.name), onEdit = { editing = i }, onRemove = { medicines.removeAt(i) })"])
          replace("rx", R12, ["private fun MedicineRow(number: Int, m: Medicine, clash: String?, onEdit: () -> Unit, onRemove: () -> Unit) {"])
          replace("rx", R13, ["Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).background(if (clash != null) Brand.RedSoft else Brand.Soft).clickable(onClick = onEdit).padding(12.dp),"])
          insert_after("rx", R14, ['if (clash != null) Text("Allergy: $clash", fontSize = 13.sp, color = Brand.Red, fontWeight = FontWeight.SemiBold)'])

          # Prescription.kt: warning before adding a medicine that matches an allergy
          replace("rx", R15, [
              "val clash = allergyClash(allergies, m.name)",
              "if (clash != null && medicines.getOrNull(index)?.name != m.name) {",
              "    allergyCheck = Triple(index, m, clash)",
              "} else if (index in medicines.indices) medicines[index] = m else medicines.add(m)",
          ])
          insert_before("rx", R16, [
              "allergyCheck?.let { (index, m, clash) ->",
              "    AllergyWarningDialog(",
              "        patient.name, m.name, clash,",
              "        onKeepOut = { allergyCheck = null },",
              "        onAddAnyway = {",
              "            if (index in medicines.indices) {",
              "                medicines[index] = m",
              "            } else {",
              "                medicines.add(m)",
              "            }",
              "            allergyCheck = null",
              "        }",
              "    )",
              "}",
          ])

          # Prescription PDF: allergies, then BP and sugar
          replace("rx", R17, [
              "val allergic = allergiesIn(patient.alerts)",
              "val others = patient.alerts.filter { allergyName(it) == null }",
              'if (allergic.isNotEmpty()) pdf.text("Allergic to: " + allergic.joinToString(", "), 10.5f, PdfRed, 2, after = 2f)',
              'if (others.isNotEmpty()) pdf.text("Medical alerts: " + others.joinToString(", "), 10f, PdfRed, 1, after = 2f)',
              "pdf.space(6f)",
          ])
          lines = text["rx"]
          i = where("rx", R18)[0]
          lines[i:i + 4] = put(indent_of(lines[i]), [
              "val vitals = listOf(",
              '    if (rx.bp.isNotBlank()) "BP: " + rx.bp + " mmHg" else "",',
              '    if (rx.sugar.isNotBlank()) "Sugar: " + rx.sugar + " mg/dL" else ""',
              ').filter { it.isNotBlank() }.joinToString("   ·   ")',
              "if (rx.findings.isNotBlank() || vitals.isNotBlank()) {",
              '    pdf.text("On examination", 9.5f, PdfSub, 1, after = 1f)',
              "    if (vitals.isNotBlank()) pdf.text(vitals, 11f, PdfInk, 1, after = if (rx.findings.isNotBlank()) 3f else 10f)",
              "    if (rx.findings.isNotBlank()) pdf.text(rx.findings, 11f, after = 10f)",
              "}",
          ])

          n = int(code.group(1))
          joined = "\n".join(text["gradle"])
          joined = joined.replace("versionCode = %d" % n, "versionCode = %d" % (n + 1), 1)
          joined = joined.replace('versionName = "%d.0"' % n, 'versionName = "%d.0"' % (n + 1), 1)
          text["gradle"] = joined.split("\n")

          for key, path in files.items():
              open(path, "w", encoding="utf-8").write("\n".join(text[key]))
              print("Changed  " + path)
          shutil.copyfile("/tmp/new/Allergies.kt", new_path)
          print("Created  " + new_path)
          print("Version %d -> %d" % (n, n + 1))
          print("ALL DONE")
          PY_END

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Allergy alert, BP and sugar on prescriptions"
          git push
