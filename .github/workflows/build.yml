name: Build APK

on:
  workflow_dispatch:
    inputs:
      trial_days:
        description: "Trial days for a client (0 = full version)"
        required: false
        default: "0"
      contact:
        description: "Your name and mobile, shown when the trial ends"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLINIC_STORE_PASSWORD: ${{ secrets.CLINIC_STORE_PASSWORD }}
      CLINIC_KEY_PASSWORD: ${{ secrets.CLINIC_KEY_PASSWORD }}
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Check the signing passwords
        run: |
          if [ -z "$CLINIC_STORE_PASSWORD" ] || [ -z "$CLINIC_KEY_PASSWORD" ]; then
            echo "::error::Add the CLINIC_STORE_PASSWORD and CLINIC_KEY_PASSWORD secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Create signing key (first time only)
        run: |
          if [ ! -f app/clinic.keystore ]; then
            keytool -genkeypair -keystore app/clinic.keystore -alias clinic \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$CLINIC_STORE_PASSWORD" -keypass "$CLINIC_KEY_PASSWORD" \
              -dname "CN=Mahalakshmi Dental Clinic, C=IN"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/clinic.keystore
            git commit -m "Add signing key"
            git push
          fi

      - name: Show SHA-1 (needed once for Google Drive setup)
        run: keytool -list -v -keystore app/clinic.keystore -alias clinic -storepass "$CLINIC_STORE_PASSWORD" | grep -E "SHA1|SHA256"

      - name: Add clinic logo
        run: |
          shopt -s nullglob nocaseglob
          files=( *.png *.jpg *.jpeg *.webp )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Logo not found. Upload your logo image (PNG or JPG) to the main page of the repository."
            exit 1
          fi
          logo="${files[0]}"
          mime=$(file --mime-type -b "$logo")
          case "$mime" in
            image/png) ext=png ;;
            image/jpeg) ext=jpg ;;
            image/webp) ext=webp ;;
            *) echo "::error::The logo must be a PNG or JPG image (found $mime)."; exit 1 ;;
          esac
          mkdir -p app/src/main/res/drawable-xxhdpi
          cp "$logo" "app/src/main/res/drawable-xxhdpi/clinic_logo.$ext"
          echo "Using logo: $logo"

      - name: Fonts (downloaded only if they are not in the repo)
        run: |
          mkdir -p app/src/main/res/font
          for w in Regular Medium SemiBold Bold; do
            name=$(echo "$w" | tr '[:upper:]' '[:lower:]')
            f="app/src/main/res/font/poppins_$name.ttf"
            if [ ! -f "$f" ]; then
              curl -fsSL -o "$f" "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-$w.ttf"
            fi
          done

      - name: Trial or full version
        id: trial
        env:
          TRIAL_DAYS: ${{ inputs.trial_days }}
          TRIAL_CONTACT: ${{ inputs.contact }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import pathlib

          raw = (os.environ.get("TRIAL_DAYS") or "0").strip()
          days = int(raw) if raw.isdigit() else 0
          contact = (os.environ.get("TRIAL_CONTACT") or "").strip()
          safe = contact.replace("\\", "\\\\").replace('"', '\\"').replace("$", "\\$")
          ist = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          now = datetime.datetime.now(ist)
          if days > 0:
              until = now + datetime.timedelta(days=days)
              until_ms = int(until.timestamp() * 1000)
              name = "Mahalakshmi-Dental-TRIAL-until-" + until.strftime("%d-%b-%Y")
              print("TRIAL version: stops working on " + until.strftime("%d %b %Y, %I:%M %p"))
          else:
              until_ms = 0
              name = "Mahalakshmi-Dental-APK"
              print("FULL version: no time limit")
          path = pathlib.Path("app/src/main/java/com/mahalakshmi/dental/TrialConfig.kt")
          path.write_text(
              "package com.mahalakshmi.dental\n\n"
              "// Written by the Build APK workflow. 0 = full version.\n"
              "const val TRIAL_UNTIL = %dL\n"
              "const val TRIAL_CONTACT = \"%s\"\n" % (until_ms, safe),
              encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("name=%s\n" % name)
          PY

      - name: Build the APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d $HOME/gradle
          $HOME/gradle/gradle-8.11.1/bin/gradle assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.trial.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
