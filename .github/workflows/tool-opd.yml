name: Tool - OPD No. on receipts and the full bill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every line, then change Bills.kt
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          KT = pathlib.Path('app/src/main/java/com/mahalakshmi/dental')
          GRADLE = pathlib.Path('app/build.gradle.kts')

          # Each change in Bills.kt: the lines that must be there now, the lines that replace them
          CHANGES = [
              (['private fun treatmentText(t: Treatment, doctors: Map<Long, String>): String {',
                'val doctor = doctors[t.doctorId].orEmpty()',
                'return if (doctor.isBlank()) t.name else "${t.name}\\n$doctor"'],
               ['private fun treatmentText(t: Treatment, doctors: Map<Long, String>, opd: String = ""): String {',
                '    val doctor = doctors[t.doctorId].orEmpty()',
                '    val second = listOf(doctor, if (opd.isNotBlank()) "OPD No. $opd" else "").filter { it.isNotBlank() }.joinToString(" · ")',
                '    return if (second.isBlank()) t.name else "${t.name}\\n$second"']),
              (['/** One bill for the whole account: every started or finished treatment, every payment, and the balance. */'],
               ['/** The visit day of each treatment: the day of its treatment record. */',
                'private fun ClinicDb.visitDays(patientId: Long): Map<Long, Long> {',
                '    val map = HashMap<Long, Long>()',
                '    runCatching {',
                '        readableDatabase.rawQuery(',
                '            "SELECT ri.treatment_id, r.day FROM record_items ri JOIN treatment_records r ON r.id = ri.record_id " +',
                '                "WHERE ri.patient_id = ?",',
                '            arrayOf(patientId.toString())',
                '        ).use { c -> while (c.moveToNext()) map[c.getLong(0)] = c.getLong(1) }',
                '    }',
                '    return map',
                '}',
                '',
                '/** One bill for the whole account: every started or finished treatment, every payment, and the balance. */']),
              (['val account = accountOf(all, payments)', 'val doctors = db.doctorNames()'],
               ['    val account = accountOf(all, payments)',
                '    val doctors = db.doctorNames()',
                '    val days = db.visitDays(patientId)']),
              (['PdfCell(treatmentText(t, doctors), 0.43f, 9.5f, PdfInk, 1),'],
               ['                PdfCell(treatmentText(t, doctors, opdId(patientId, days[t.id] ?: epochDayOf(t.createdAt))), 0.43f, 9.5f, PdfInk, 1),']),
              (['pdf.title("PAYMENT RECEIPT", "")'],
               ['    pdf.title("PAYMENT RECEIPT", "OPD No. " + opdId(pay.patientId, epochDayOf(pay.date)))']),
          ]

          problems = []
          helpers = KT / 'AppHelpers.kt'
          if not helpers.is_file() or 'fun opdId(' not in helpers.read_text(encoding='utf-8'):
              problems.append('AppHelpers.kt with the patient IDs is missing: run the earlier tool (tool-v37.yml) first')

          path = KT / 'Bills.kt'
          lines = path.read_text(encoding='utf-8').split('\n') if path.is_file() else None
          found = []
          if lines is None:
              problems.append('Bills.kt was not found')
          else:
              for old, new in CHANGES:
                  hits = [i for i in range(len(lines) - len(old) + 1)
                          if all(lines[i + k].strip() == old[k] for k in range(len(old)))]
                  if len(hits) != 1:
                      problems.append('Bills.kt: expected once, found %d times: %s' % (len(hits), ' | '.join(old)))
                  else:
                      found.append((hits[0], len(old), new))

          gradle = GRADLE.read_text(encoding='utf-8').split('\n') if GRADLE.is_file() else []
          code = [i for i, l in enumerate(gradle) if re.fullmatch(r'\s*versionCode\s*=\s*\d+\s*', l)]
          vname = [i for i, l in enumerate(gradle) if re.fullmatch(r'\s*versionName\s*=\s*"\d+\.0"\s*', l)]
          if len(code) != 1 or len(vname) != 1:
              problems.append('app/build.gradle.kts: versionCode / versionName lines not found exactly once')

          if problems:
              print('NOTHING WAS CHANGED')
              for p in problems:
                  print(' - ' + p)
              sys.exit(1)

          for start, count, new in sorted(found, key=lambda f: -f[0]):
              lines[start:start + count] = new
          path.write_text('\n'.join(lines), encoding='utf-8')
          version = int(re.search(r'\d+', gradle[code[0]]).group(0)) + 1
          gradle[code[0]] = re.sub(r'\d+', str(version), gradle[code[0]], count=1)
          gradle[vname[0]] = re.sub(r'"\d+\.0"', '"%d.0"' % version, gradle[vname[0]], count=1)
          GRADLE.write_text('\n'.join(gradle), encoding='utf-8')
          print('OPD No. added to payment receipts and the full bill. New version: %d' % version)
          PY

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "OPD No. on payment receipts and on each line of the full bill"
          git push
