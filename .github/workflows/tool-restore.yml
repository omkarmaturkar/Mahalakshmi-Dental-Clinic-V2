              return line[:len(line) - len(line.lstrip())]

          def put(ind, new_lines):
              return [(ind + n) if n else "" for n in new_lines]

          def insert_before(key, old, new_lines):
              lines = text[key]
              i = where(key, old)[0]
              lines[i:i] = put(indent_of(lines[i]), new_lines)

          def snippet(name):
              return open("/tmp/new/" + name, encoding="utf-8").read().rstrip("\n").split("\n") + [""]

          # DriveBackup.kt: add patients from another phone's Drive backup, and keep a safety copy before a restore
          insert_before("drive", D_TALK, snippet("drive_add.txt"))
          insert_before("drive", CLOSE, ["RestoreSafety.keepForReplace(c, db)   // keeps this phone's data, so the restore can be undone"])
          # Backup.kt: add patients from a .zip file, and keep a safety copy before a restore
          insert_before("backup", B_HELP, snippet("backup_add.txt"))
          insert_before("backup", CLOSE, ["RestoreSafety.keepForReplace(c, db)   // keeps this phone's data, so the restore can be undone"])

          n = int(code.group(1))
          joined = "\n".join(text["gradle"])
          joined = joined.replace("versionCode = %d" % n, "versionCode = %d" % (n + 1), 1)
          joined = joined.replace('versionName = "%d.0"' % n, 'versionName = "%d.0"' % (n + 1), 1)
          text["gradle"] = joined.split("\n")

          for key in ["drive", "backup", "gradle"]:
              open(files[key], "w", encoding="utf-8").write("\n".join(text[key]))
              print("Changed  " + files[key])
          shutil.copyfile("/tmp/new/BackupScreen.kt", files["screen"])
          print("Replaced " + files["screen"])
          shutil.copyfile("/tmp/new/SafeRestore.kt", safe_path)
          print("Created  " + safe_path)
          print("Version %d -> %d" % (n, n + 1))
          print("ALL DONE")
          PY_END

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Undo last restore, clear warnings, add patients from another phone"
          git push
