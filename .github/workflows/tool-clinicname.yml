name: tool-clinicname

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every line, then change
        run: |
          python3 - <<'PY_END'
          import glob, os, re, sys

          def stop(msg):
              print(msg)
              print("NOTHING WAS CHANGED")
              sys.exit(1)

          hits = glob.glob("app/src/main/**/ClinicSettings.kt", recursive=True)
          if len(hits) != 1:
              stop("Could not find exactly one ClinicSettings.kt (found %d)" % len(hits))
          files = {"clinic": hits[0], "gradle": "app/build.gradle.kts"}
          text = {}
          for key, path in files.items():
              if not os.path.exists(path):
                  stop("Missing file: " + path)
              text[key] = open(path, encoding="utf-8").read().split("\n")

          problems = []

          def where(key, old):
              return [i for i, l in enumerate(text[key]) if l.strip() == old]

          def check(key, old, count=1):
              n = len(where(key, old))
              if n == count:
                  print("OK       " + files[key] + ":  " + old)
              else:
                  print("MISSING  " + files[key] + ":  " + old + "  (found %d, expected %d)" % (n, count))
                  problems.append(old)

          C1 = 'name = map["clinic_name"]?.takeIf { it.isNotBlank() } ?: DEFAULT_CLINIC_NAME,'
          C2 = "val withReg = onBills.filter { it.regNo.isNotBlank() }"
          C3 = 'AppField(name, { name = it }, "Clinic name *", icon = AppIcons.Tooth, caps = KeyboardCapitalization.Words)'
          D = 'const val DEFAULT_CLINIC_NAME = "Mahalaxmi Dental Clinic"'
          check("clinic", C1)
          check("clinic", C2)
          check("clinic", C3)
          check("clinic", D)

          kt_files = glob.glob("app/src/main/**/*.kt", recursive=True)
          everything = ""
          for p in kt_files:
              everything += open(p, encoding="utf-8").read()
          if "val ClinicTitleFont" not in everything:
              print("MISSING  ClinicTitleFont (from the font tool)")
              problems.append("ClinicTitleFont")

          joined = "\n".join(text["gradle"])
          code = re.search(r"versionCode = (\d+)", joined)
          vname = re.search(r'versionName = "(\d+)\.0"', joined)
          if code and vname and code.group(1) == vname.group(1):
              print("OK       version " + code.group(1))
          else:
              print("MISSING  versionCode and versionName lines")
              problems.append("version")

          if problems:
              stop("Some lines did not match.")

          def indent_of(line):
              return line[:len(line) - len(line.lstrip())]

          def put(ind, new_lines):
              return [(ind + n) if n else "" for n in new_lines]

          def replace(key, old, new_lines):
              lines = text[key]
              for i in reversed(where(key, old)):
                  lines[i:i + 1] = put(indent_of(lines[i]), new_lines)

          def insert_before(key, old, new_lines):
              lines = text[key]
              i = where(key, old)[0]
              lines[i:i] = put(indent_of(lines[i]), new_lines)

          # The name is built into the app
          replace("clinic", C1, ["name = DEFAULT_CLINIC_NAME,"])
          insert_before("clinic", C2, [
              "// This app is only for Mahalaxmi Dental Clinic: the name is built in, and a name typed earlier is corrected once",
              'if (map["clinic_name"] != DEFAULT_CLINIC_NAME) putSetting("clinic_name", DEFAULT_CLINIC_NAME)',
          ])
          # Clinic & doctors shows the name instead of a box to type it
          replace("clinic", C3, ["Text(DEFAULT_CLINIC_NAME, fontFamily = ClinicTitleFont, fontWeight = FontWeight.SemiBold, fontSize = 17.sp, color = Brand.Ink)"])

          n = int(code.group(1))
          joined = "\n".join(text["gradle"])
          joined = joined.replace("versionCode = %d" % n, "versionCode = %d" % (n + 1), 1)
          joined = joined.replace('versionName = "%d.0"' % n, 'versionName = "%d.0"' % (n + 1), 1)
          text["gradle"] = joined.split("\n")

          for key, path in files.items():
              open(path, "w", encoding="utf-8").write("\n".join(text[key]))
              print("Changed  " + path)
          print("Version %d -> %d" % (n, n + 1))

          for p in kt_files:
              for num, l in enumerate(open(p, encoding="utf-8").read().split("\n"), 1):
                  if '"clinic_name"' in l and not p.endswith("ClinicSettings.kt"):
                      print("NOTE     " + p + " line %d also reads the clinic name" % num)
                  if "Mahalxmi" in l:
                      print("NOTE     " + p + " line %d has the wrong spelling" % num)
          print("ALL DONE")
          PY_END

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clinic name built into the app"
          git push
