name: Tool - Fixes round 1

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every line first, then apply the fixes
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          K = "app/src/main/java/com/mahalakshmi/dental/"
          texts = {}
          problems = []

          def path_of(name):
              return pathlib.Path(name if "/" in name else K + name)

          def load(name):
              if name not in texts:
                  p = path_of(name)
                  texts[name] = p.read_text(encoding="utf-8") if p.exists() else None
                  if texts[name] is None:
                      problems.append(f"{name}: file not found")
              return texts[name]

          def change(name, old, new, count=1):
              t = load(name)
              if t is None:
                  return
              found = t.count(old)
              if found != count:
                  problems.append(f"{name}: expected {count}, found {found}: {old[:80]!r}")
                  return
              texts[name] = t.replace(old, new)

          def change_re(name, pattern, new, count=1):
              t = load(name)
              if t is None:
                  return
              t2, n = re.subn(pattern, new, t)
              if n != count:
                  problems.append(f"{name}: expected {count}, found {n}: {pattern[:60]!r}")
                  return
              texts[name] = t2

          def line_start(t, needle):
              return t.rfind("\n", 0, t.index(needle)) + 1

          def cut(name, start, end=None):
              t = load(name)
              if t is None:
                  return
              if t.count(start) != 1 or (end is not None and t.count(end) != 1):
                  problems.append(f"{name}: section not found: {start[:60]!r}")
                  return
              a = line_start(t, start)
              b = len(t) if end is None else line_start(t, end)
              if b <= a:
                  problems.append(f"{name}: section in the wrong order: {start[:60]!r}")
                  return
              texts[name] = t[:a] + t[b:]

          # No. 9: the signing passwords come from GitHub secrets, not from this file
          change_re("app/build.gradle.kts", r'storePassword = "[^"]*"',
                    'storePassword = System.getenv("CLINIC_STORE_PASSWORD") ?: ""')
          change_re("app/build.gradle.kts", r'keyPassword = "[^"]*"',
                    'keyPassword = System.getenv("CLINIC_KEY_PASSWORD") ?: ""')

          # No. 2: deleting a patient also removes their sittings, gum charts, mouth status and braces records
          change("ExtraTables.kt",
                 "// Called when a patient is deleted: removes their treatments, notes, photos, appointments and prescriptions",
                 "// Called when a patient is deleted: removes their treatments, notes, photos, appointments and prescriptions,\n"
                 "// and their sittings, gum charts, mouth status and braces records")
          change("ExtraTables.kt",
                 'listOf("prescriptions", "treatments", "case_notes", "case_photos", "appointments").forEach { table ->',
                 'deleteFeatureData(patientId)\n'
                 '    listOf("prescriptions", "treatments", "case_notes", "case_photos", "appointments").forEach { table ->')
          change("PatientEdit.kt",
                 '"All treatments, payments, prescriptions and photos of this patient will be permanently deleted."',
                 '"All treatments, payments, prescriptions, photos, sittings, gum charts, mouth status and braces records of this patient will be permanently deleted."')
          change("MainActivity.kt",
                 "db = ClinicDb(applicationContext)",
                 "db = ClinicDb(applicationContext)\n"
                 "        // Removes records left behind by patients deleted earlier (runs in the background)\n"
                 "        Thread { runCatching { db.removeLeftoverData() } }.start()")

          # No. 4: refresh every screen when a new day starts
          change("MainActivity.kt",
                 "BackHandler(enabled = stack.size > 1) { back() }",
                 "BackHandler(enabled = stack.size > 1) { back() }\n\n"
                 "    // A new day has started: refresh every screen, so a tablet left on overnight shows today's lists\n"
                 "    LaunchedEffect(Unit) {\n"
                 "        var day = todayEpochDay()\n"
                 "        while (true) {\n"
                 "            delay(30_000)\n"
                 "            val now = todayEpochDay()\n"
                 "            if (now != day) {\n"
                 "                day = now\n"
                 "                DataBus.changed()\n"
                 "            }\n"
                 "        }\n"
                 "    }")
          change("FinanceScreen.kt",
                 "val range = remember(period, chosen) {",
                 "val today = todayEpochDay()\n    val range = remember(period, chosen, today) {")

          # No. 3: a sitting that was already paid does not suggest the fee again
          change("Sittings.kt",
                 "SittingDoneDialog(t, s, hasNext = after != null, onDismiss = { finishing = null }) { day, amount, mode, bookNext ->",
                 "SittingDoneDialog(\n"
                 "            t, s, hasNext = after != null, alreadyPaid = payments[s.paymentId]?.amount ?: 0.0,\n"
                 "            onDismiss = { finishing = null }\n"
                 "        ) { day, amount, mode, bookNext ->")
          change("Sittings.kt", "hasNext: Boolean,", "hasNext: Boolean,\n    alreadyPaid: Double,")
          change("Sittings.kt",
                 "var amount by remember { mutableStateOf(numText(s.fee)) }",
                 "// Money already taken at this sitting (it was marked done before): don't suggest the fee again\n"
                 '    var amount by remember { mutableStateOf(if (alreadyPaid > 0.0) "" else numText(s.fee)) }')
          change("Sittings.kt",
                 'Text("Payment taken at this sitting (optional)", fontSize = 13.sp, color = Brand.Sub, fontWeight = FontWeight.Medium)',
                 'Text("Payment taken at this sitting (optional)", fontSize = 13.sp, color = Brand.Sub, fontWeight = FontWeight.Medium)\n'
                 '            if (alreadyPaid > 0.0) {\n'
                 '                Pill("${rs(alreadyPaid)} already received at this sitting", Brand.GreenSoft, Brand.GreenText, Icons.Filled.Check)\n'
                 '            }')

          # No. 5: reminders use the clinic name saved in Clinic & doctors
          change("PatientScreens.kt",
                 "fun reminderMessage(p: Patient, nextVisit: Long?): String {",
                 "fun reminderMessage(p: Patient, nextVisit: Long?, clinicName: String): String {")
          change("PatientScreens.kt", "a gentle reminder from Mahalakshmi Dental Clinic. ", "a gentle reminder from $clinicName. ")
          change("PatientScreens.kt", "a reminder from Mahalakshmi Dental Clinic for your next", "a reminder from $clinicName for your next")
          change("PatientScreens.kt", "greetings from Mahalakshmi Dental Clinic! ", "greetings from $clinicName! ")
          change("PatientScreens.kt", "reminderMessage(patient, booking?.day)", "reminderMessage(patient, booking?.day, clinicName)")
          change("PatientsScreen.kt",
                 "val todayIds = remember(version) { db.upcoming(0).map { it.patientId }.toSet() }",
                 "val todayIds = remember(version) { db.upcoming(0).map { it.patientId }.toSet() }\n"
                 "    val clinicName = remember(version) { db.clinicInfo().name }")
          change("PatientsScreen.kt", "reminderMessage(p, null)", "reminderMessage(p, null, clinicName)")

          # Nos. 10-12, patient file only: calm grey instead of purple and blue, easier text, bigger buttons
          change("PatientScreens.kt",
                 "private val Purple = Color(0xFF7B4FD6)\n"
                 "private val PurpleSoft get() = if (AppTheme.dark) Color(0xFF2B2442) else Color(0xFFF1EBFF)\n"
                 "private val Blue = Color(0xFF2F6FED)\n"
                 "private val BlueSoft get() = if (AppTheme.dark) Color(0xFF1B2A45) else Color(0xFFE8F0FF)",
                 "/** Calm grey for icons that are not about money or treatment status. */\n"
                 "private val NeutralIcon: Color get() = Brand.Slate\n"
                 "private val NeutralSoft: Color get() = Brand.Soft")
          change("PatientScreens.kt", "Purple, PurpleSoft", "NeutralIcon, NeutralSoft", 3)
          change("PatientScreens.kt", "Blue, BlueSoft", "NeutralIcon, NeutralSoft", 2)
          change("PatientScreens.kt", "fontSize = 11.sp, color = Brand.Faint", "fontSize = 12.sp, color = Brand.Sub", 5)
          change("PatientScreens.kt", "Text(label, fontSize = 11.sp, color = Brand.Sub)", "Text(label, fontSize = 12.sp, color = Brand.Sub)")
          change("PatientScreens.kt", "size = 38.dp)", "size = 44.dp)", 3)

          # Start screen: the animation fits into the 1.1 seconds the app shows it
          change("SplashScreen.kt", "delay(250)", "delay(150)")
          change("SplashScreen.kt", "delay(600)", "delay(250)")
          change("SplashScreen.kt", "delay(500)", "delay(300)")
          change("SplashScreen.kt", "delay(1150)", "delay(400)")
          change("SplashScreen.kt", "logoAlpha.animateTo(1f, tween(550))", "logoAlpha.animateTo(1f, tween(450))")
          change("SplashScreen.kt", "shine.animateTo(1f, tween(1000, easing = FastOutSlowInEasing))",
                 "shine.animateTo(1f, tween(800, easing = FastOutSlowInEasing))")
          change("SplashScreen.kt", "textAlpha.animateTo(1f, tween(650))", "textAlpha.animateTo(1f, tween(450))")
          change("SplashScreen.kt", "textShift.animateTo(0f, tween(750, easing = FastOutSlowInEasing))",
                 "textShift.animateTo(0f, tween(550, easing = FastOutSlowInEasing))")
          change("SplashScreen.kt", "spacing.animateTo(1f, tween(1000, easing = FastOutSlowInEasing))",
                 "spacing.animateTo(1f, tween(700, easing = FastOutSlowInEasing))")
          change("SplashScreen.kt", "glint.animateTo(1f, tween(380, easing = FastOutSlowInEasing))",
                 "glint.animateTo(1f, tween(300, easing = FastOutSlowInEasing))")
          change("SplashScreen.kt", "glint.animateTo(0f, tween(600))", "glint.animateTo(0f, tween(400))")
          change("SplashScreen.kt", "tagAlpha.animateTo(1f, tween(600))", "tagAlpha.animateTo(1f, tween(350))")

          # No. 8: old code that nothing uses any more
          cut("HomeScreen.kt", "@Composable\nfun Greeting(", "@Composable\nfun DueBadge(")
          cut("HomeScreen.kt", "@Composable\nprivate fun SidebarPatientRow(")
          cut("PatientSheets.kt", "Coloured dental chart", "Add / edit treatment")
          cut("VisitScreen.kt", "New / edit visit", "fun withDay(")
          cut("VisitScreen.kt", " Dental chart ", " Photos ")

          FEATURE_CODE = r'''
          // ───────────── Tables of the clinical features ─────────────
          // Sittings, gum charts, mouth status and braces records create their own tables the first time they are used.

          private val FEATURE_TABLES = listOf("sittings", "perio_exams", "tooth_status", "ortho_visits", "ortho_cases")

          private fun tableHasColumn(sql: SQLiteDatabase, table: String, column: String): Boolean =
              sql.rawQuery("PRAGMA table_info($table)", null).use { c ->
                  var found = false
                  while (c.moveToNext()) {
                      if (c.getString(1) == column) found = true
                  }
                  found
              }

          /** Removes one patient's sittings, gum charts, mouth status and braces records. */
          fun ClinicDb.deleteFeatureData(patientId: Long) {
              val sql = writableDatabase
              val args = arrayOf(patientId.toString())
              if (tableHasColumn(sql, "ortho_payments", "case_id") && tableHasColumn(sql, "ortho_cases", "patient_id")) {
                  sql.delete("ortho_payments", "case_id IN (SELECT id FROM ortho_cases WHERE patient_id = ?)", args)
              }
              FEATURE_TABLES.forEach { table ->
                  if (tableHasColumn(sql, table, "patient_id")) sql.delete(table, "patient_id = ?", args)
              }
          }

          /**
           * Removes feature records whose patient, treatment or braces case no longer exists
           * (left behind by older versions of the app). Safe to run at any time.
           */
          fun ClinicDb.removeLeftoverData() {
              val sql = writableDatabase
              sql.beginTransaction()
              try {
                  FEATURE_TABLES.forEach { table ->
                      if (tableHasColumn(sql, table, "patient_id")) {
                          sql.delete(table, "patient_id NOT IN (SELECT id FROM patients)", null)
                      }
                  }
                  if (tableHasColumn(sql, "sittings", "treatment_id")) {
                      sql.delete("sittings", "treatment_id NOT IN (SELECT id FROM treatments)", null)
                  }
                  if (tableHasColumn(sql, "ortho_cases", "id")) {
                      if (tableHasColumn(sql, "ortho_visits", "case_id")) {
                          sql.delete("ortho_visits", "case_id NOT IN (SELECT id FROM ortho_cases)", null)
                      }
                      if (tableHasColumn(sql, "ortho_payments", "case_id")) {
                          sql.delete("ortho_payments", "case_id NOT IN (SELECT id FROM ortho_cases)", null)
                      }
                  }
                  sql.setTransactionSuccessful()
              } finally {
                  sql.endTransaction()
              }
          }
          '''
          t = load("ExtraTables.kt")
          if t is not None:
              texts["ExtraTables.kt"] = t.rstrip("\n") + "\n" + FEATURE_CODE

          renames = {"HomeScreen.kt": "PatientCards.kt", "VisitScreen.kt": "PhotosAndDates.kt"}
          for new_name in renames.values():
              if path_of(new_name).exists():
                  problems.append(f"{new_name} already exists (this tool has already been run)")

          if problems:
              print("NOTHING WAS CHANGED, because these lines were not as expected:")
              print("\n".join(problems))
              sys.exit(1)

          for name, t in texts.items():
              path_of(renames.get(name, name)).write_text(t.rstrip("\n") + "\n", encoding="utf-8")
              if name in renames:
                  path_of(name).unlink()
                  print(f"Cleaned {name} and renamed it to {renames[name]}")
              else:
                  print("Updated", name)
          PY

      - name: "No. 7: keep the Poppins font in the repo"
        run: |
          mkdir -p app/src/main/res/font
          for w in Regular Medium SemiBold Bold; do
            name=$(echo "$w" | tr '[:upper:]' '[:lower:]')
            f="app/src/main/res/font/poppins_$name.ttf"
            if [ ! -f "$f" ]; then
              curl -fsSL -o "$f" "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-$w.ttf"
              echo "Saved $f"
            fi
          done

      - name: Raise the version
        run: |
          python3 - <<'PY'
          import re
          p = "app/build.gradle.kts"
          s = open(p).read()
          code = int(re.search(r"versionCode\s*=?\s*(\d+)", s).group(1)) + 1
          s = re.sub(r"(versionCode\s*=?\s*)\d+", lambda m: m.group(1) + str(code), s, count=1)
          s = re.sub(r'(versionName\s*=?\s*")[^"]*"', lambda m: m.group(1) + f'{code}.0"', s, count=1)
          open(p, "w").write(s)
          print("Version is now", code)
          PY

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fixes round 1: deletion, sittings, new day, clinic name, start screen, old code, fonts, signing secrets, patient file test"
          git push

      - name: Start the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main || echo "Please start Build APK yourself from the Actions page"
